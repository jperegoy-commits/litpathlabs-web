<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | LitPath Labs</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #ededed;
            --text-secondary: #a0a0a0;
            --accent: #4f46e5;
            --card-bg: #171717;
            --border: #262626;
        }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
        }

        header a.home {
            color: var(--text-primary);
            text-decoration: none;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin: 0;
            font-weight: 300;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .lead {
            color: var(--text-secondary);
            margin: 0 0 2rem 0;
        }

        .form-frame {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .form-frame iframe {
            display: block;
            width: 100%;
            height: 1100px;
            border: 0;
            border-radius: 6px;
            background-color: #ffffff;
        }

        .fallback {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #818cf8;
        }

        @media (max-width: 600px) {
            header { padding: 2rem 1rem; }
            h1 { font-size: 2rem; }
            main { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1><a class="home" href="../">LitPath Labs</a></h1>
        <p class="subtitle">Contact</p>
    </header>

    <main>
        <p class="lead">Questions, notes or corrections about the projects or the field manual.</p>
        <div class="form-frame">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfvhfnwV1NajScrZu1xWMJ5Nl02_mfDQYDcdiDDaLLtLb5g_g/viewform?embedded=true" title="Contact LitPath Labs" loading="lazy">Loading the form…</iframe>
        </div>
        <p class="fallback">Form not showing? <a href="https://docs.google.com/forms/d/e/1FAIpQLSfvhfnwV1NajScrZu1xWMJ5Nl02_mfDQYDcdiDDaLLtLb5g_g/viewform">Open it in a new page</a>.</p>
    </main>

    <footer>
        <p><a href="../">Back to LitPath Labs</a></p>
        <p>&copy; 2026 LitPath Labs. All metrics empirical.</p>
    </footer>
</body>
</html>
